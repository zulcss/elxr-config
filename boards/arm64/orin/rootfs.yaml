---
name: elxr-minimal-orin
description: "oriin minimal configuration."
architecture: arm64
version: 0.1
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
  image: ${oc.env:CURRENT_DIR}/${name}-${version}-${architecture}.img
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebestrap
      options:
        suite: bookworm
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/orin/ /'
          - 'sync-in overlay/xorg-imx8/ /'
        customize_hooks:
          - 'sync-in overlay/grub-efi/ /'
          - echo 'root:root' | chroot "$1" chpasswd
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" elxr-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
          - mkdir -p $1/usr/lib/ostree-grub/EFI/BOOT/
          - export GRUB_MKIMAGE_MODULES=$(find $1/usr/lib/grub/arm64-efi/ -type f -name "*.mod" -exec basename {} .mod \;);
            chroot $1 grub-mkimage -p /EFI/debian -O arm64-efi -o /usr/lib/ostree-grub/EFI/BOOT/bootaa64.efi $GRUB_MKIMAGE_MODULES;
          - cd $1/usr/lib/modules; for d in $(ls * -d); do mkdir -p $1/usr/lib/modules/$d/dtb;
            cp -rf $1/usr/lib/linux-image-$d/nvidia/* $1/usr/lib/modules/$d/dtb; done; cd -
        packages:
          - ${include:manifests/packages-orin.yaml}
        mirrors:
          - deb http://deb.debian.org/debian bookworm main non-free-firmware
          - deb http://deb.debian.org/debian bookworm-updates main
          - deb http://security.debian.org/debian-security bookworm-security main
          - deb http://mirror.elxr.dev/elxr aria main
