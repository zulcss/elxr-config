---
name: pablo-xfce4-ostree-imx8
description: "i.MX8 xfce4 ostree configuration."
architecture: arm64
version: 0.1
schemaVersion: 1
params:
  version: ${version}
  tarball: ${oc.env:CURRENT_DIR}/pablo-ostree-${version}-${architecture}.tar.gz
  source: ${oc.env:CURRENT_DIR}/pablo-ostree-${version}-${architecture}.tar.gz
  repository: /var/www/html/repo
  branch: pablo/${architecture}
  image: ${oc.env:CURRENT_DIR}/${name}-${version}-${architecture}.img
  disk: /dev/loop1
stages:
  install:
    - name: "Create rootfs"
      module: bootstrap.mmdebestrap
      options:
        suite: bookworm
        target: ${params.tarball}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/debian/ /'
          - 'sync-in overlay/grub-efi/ /'
        customize_hooks:
          - 'sync-in overlay/ostree/usr/lib /usr/lib'
          - 'sync-in overlay/xorg-imx8/etc/X11/xorg.conf.d/ /etc/X11/xorg.conf.d/'
          - echo 'root:root' | chroot "$1" chpasswd
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" pablo-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
          - mkdir -p $1/efi
          - mkdir -p $1/usr/lib/ostree-grub/EFI/BOOT/
          - export GRUB_MKIMAGE_MODULES=$(find $1/usr/lib/grub/arm64-efi/ -type f -name "*.mod" -exec basename {} .mod \;);
            chroot $1 grub-mkimage -p /EFI/debian -O arm64-efi -o /usr/lib/ostree-grub/EFI/BOOT/bootaa64.efi $GRUB_MKIMAGE_MODULES;
        packages:
          - ${include:manifests/packages-arm64-ostree.yaml}
          - ${include:manifests/packages-xfce4.yaml}
          - systemd-timesyncd
        mirrors:
          - deb http://deb.debian.org/debian bookworm main
          - deb http://deb.debian.org/debian bookworm-updates main
          - deb http://security.debian.org/debian-security bookworm-security main
          - deb http://10.249.254.4 wr main

    - name: "Unpack ${params.tarball}"
      module: unpack.tarball
      options:
        compression: tgz
        sources:
          - ${params.tarball}

    - name: "Create ostree repository"
      module: installer.ostree.init
      options:
        mode: archive-z2

    - name: "Create an ostree branch."
      module: installer.ostree.prep

    - name: "Create raw image ${params.image}"
      module: image.raw
      options:
        name: ${params.image}
        size: 4G

    - name: "Partitioning ${params.disk}."
      module: installer.disk.parted
      options:
        slices:
          - name: EFI
            start: 10MB
            end: 128MB
            flags: [boot, esp]
            id: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
          - name: BOOT
            start: 128M
            end: 640M
            flags: []
            id: bc13c2ff-59e6-4262-a352-b275fd6f7172
          - name: ROOT
            start: 640MB
            end: 100%
            flags: []
            id: ''

    - name: "Formatting ${params.disk}."
      module: installer.disk.fs
      options:
        filesystems:
          - name: EFI
            label: EFI
            fs: vfat
            options: []
          - name: BOOT
            label: BOOT
            fs: ext4
            options: []
          - name: ROOT
            label: ROOT
            fs: ext4
            options: []

    - name: "Deploy on ${params.disk}."
      module: utils.deploy

    - name: "Create ostree repository"
      module: installer.ostree.init
      options:
        mode: archive-z2

    - name: "Pull ostree from ${params.repository}."
      module: installer.ostree.pull.local

    - name: "Deploy ostree ${params.branch} to ${params.disk}."
      module: installer.ostree.deploy
      options:
        kernel_args:
          - root=LABEL=ROOT
          - rw
          - console=tty0 console=ttymxc0,115200
          - fdt_file=imx8mq-evk.dtb

    - name: "Installing ostree bootloader on ${params.disk}"
      module: installer.bootloader.ostree
      options:
        uefi: grub-efi

    - name: "Undeploy on ${params.disk}."
      module: utils.undeploy

    - name: "Compress image ${params.image}"
      module: image.compress
      options:
        name: ${params.image}
        compression: zstd
