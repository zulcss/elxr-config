# Ultra-minimal dracut configuration for edge devices
# Exclude unnecessary drivers at initramfs build time

# Only include essential modules
add_dracutmodules+=" base systemd systemd-initrd kernel-modules rootfs-block "

# Exclude unnecessary modules
omit_dracutmodules+=" network ifcfg bluetooth usrmount i18n "

# Exclude driver categories
omit_drivers+=" snd* gpu* media* staging* "

# Compress initramfs
compress="zstd"
compresslevel=19

# Essential drivers only
drivers+=" ext4 ahci virtio_pci virtio_blk virtio_net e1000 e1000e "

# Skip unnecessary checks
nofscks="yes"

# Minimal hostonly mode
hostonly="no"
hostonly_cmdline="no"