---
name: cleanup
description: "Aggressive cleanup for minimal size on ARM64"
packages: []

customize_hooks:
  - rm -rf $1/usr/share/man/* $1/usr/share/info/* $1/usr/share/linda/* $1/usr/share/lintian/*
  - find $1 -name '*.pyc' -delete
  - find $1 -name '__pycache__' -type d -exec rm -rf {} +
  - find $1/usr/share -name '*.a' -delete
  - find $1/usr/lib -name '*.a' -delete
  - find $1/lib/modules -name '*.ko' -exec strip --strip-unneeded {} \; 2>/dev/null || true
  - find $1/usr/bin $1/usr/sbin $1/bin $1/sbin -type f -executable -exec strip --strip-all {} \; 2>/dev/null || true
  - find $1/usr/lib -name '*.so.*' -exec strip --strip-unneeded {} \; 2>/dev/null || true
  - rm -rf $1/usr/share/pixmaps $1/usr/share/icons $1/usr/share/sounds $1/usr/share/bash-completion $1/usr/share/debconf
  - rm -rf $1/usr/share/zoneinfo/* $1/usr/lib/aarch64-linux-gnu/gconv 2>/dev/null || true
  - find $1/usr/lib -name "*.la" -delete 2>/dev/null || true
  - find $1 -name "*.pyo" -delete 2>/dev/null || true
  - rm -rf $1/usr/share/mime $1/usr/share/xml 2>/dev/null || true
  - find $1/usr/lib/python* -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
  - find $1/usr/lib/python* -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
  - rm -rf $1/usr/lib/systemd/catalog $1/var/lib/systemd/catalog 2>/dev/null || true
  - truncate -s 0 $1/var/log/lastlog $1/var/log/faillog 2>/dev/null || true
  - find $1/usr/lib -name "*.so.*" -exec strip --strip-debug {} \; 2>/dev/null || true
  - find $1/usr/share/terminfo -mindepth 1 -maxdepth 1 ! -name "l" ! -name "x" ! -name "v" ! -name "a" -exec rm -rf {} + 2>/dev/null || true

dpkgopt: []
