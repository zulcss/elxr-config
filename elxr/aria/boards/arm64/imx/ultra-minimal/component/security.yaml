---
name: security
description: "Essential security components, minimal CA certificates for ARM64"

packages:
  - ca-certificates
  - gnupg

customize_hooks:
  - chroot $1 apt-key add /etc/apt/trusted.gpg.d/eLxr-base.asc 2>/dev/null || true
  - rm -rf $1/usr/share/ca-certificates/mozilla/* 2>/dev/null || true

dpkgopt: []