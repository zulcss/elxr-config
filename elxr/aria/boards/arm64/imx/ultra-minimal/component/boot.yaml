---
name: boot
description: "Essential boot components (grub, kernel, init) for ARM64"
packages:
  - grub-efi-arm64-bin
  - grub-efi-arm64
  - grub2-common
  - linux-image-imx-arm64
  - systemd
  - systemd-sysv
  - udev
  - dbus

customize_hooks:
  - mkdir -p $/efi
  - cd $1/usr/lib/modules; for d in $(ls * -d); do mkdir -p $1/usr/lib/modules/$d/dtb;
    cp -rf $1/usr/lib/linux-image-$d/freescale/imx*.dtb $1/usr/lib/modules/$d/dtb; done; cd -
