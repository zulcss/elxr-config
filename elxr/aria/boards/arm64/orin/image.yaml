---
name: elxr-orin-jetson
description: "orin minimal configuration."
architecture: arm64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-tegra-installer-${version}-${architecture}.tar.gz
  disk: ${oc.env:CURRENT_DIR}/${name}-tegra-${version}-${architecture}.img
  bootloader: bootloader/esp.img
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: aria
        components:
          - main
          - non-free-firmware
          - contrib
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/orin-image/ /'
        customize_hooks:
          - echo 'root' | chroot "$1" passwd -e -s root
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" elxr-growfs
          - rm -f $1/etc/X11/xorg.conf.d/fb.conf
          - cp $1/vmlinuz $1/boot/Image
          - cp $1/initrd.img $1/boot/initrd
          - |
            install -Dm644 /etc/resolv.conf "$1/run/systemd/resolve/stub-resolv.conf"
            chroot $1 sh -c "set -e
            URLS='
            http://ftp.debian.org/debian/pool/main/p/procps/libprocps8_3.3.17-5_arm64.deb
            http://ftp.debian.org/debian/pool/main/libf/libffi/libffi7_3.3-6_arm64.deb
            http://ports.ubuntu.com/pool/main/libj/libjpeg-turbo/libjpeg-turbo8_2.1.5-4ubuntu2_arm64.deb'
            for url in \$URLS; do f=/tmp/\$(basename \$url); wget -q \$url -O \$f && apt install -y \$f && rm \$f; done"
            rm -rf "$1/run/systemd"
        packages:
          - ${include:manifests/packages-orin.yaml}
          - ${include:manifests/packages-xfce4.yaml}
          - systemd-timesyncd

    - name: "Create raw image ${params.disk}"
      module: image.raw
      options:
         name: ${params.disk}
         size: 8G

    - name: "Partitioning ${params.disk}."
      module: installer.disk.parted
      options:
        slices:
          - name: EFI
            start: 1MiB
            end: 65MiB
            flags: [boot, esp]
            id: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
          - name: APP
            start: 65MiB
            end: 100%
            flags: []
            id: ''
            

    - name: "Formatting ${params.disk}."
      module: installer.disk.fs
      options:
        filesystems:
          - name: EFI
            label: EFI
            fs: vfat
            options: []
          - name: APP
            label: APP
            fs: ext4
            options: []

    - name: install bootloader
      module: utils.run_shell
      options:
       commands:
         - dd if=${params.bootloader} of=${params.disk}p1  bs=4M status=progress

    - name: "Unpacking ${params.source}"
      module: installer.unpack
      options: []
