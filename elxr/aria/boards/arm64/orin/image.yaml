---
name: elxr-orin-jetson
description: "orin minimal configuration."
architecture: arm64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-tegra-installer-${version}-${architecture}.tar.gz
  disk: ${oc.env:CURRENT_DIR}/${name}-tegra-${version}-${architecture}.img
  bootloader: bootloader/esp.img
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: aria
        components:
          - main
          - non-free-firmware
          - contrib
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/orin-image/ /'
        customize_hooks:
          - echo 'root' | chroot "$1" passwd -e -s root
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" elxr-growfs
          - rm -f $1/etc/X11/xorg.conf.d/fb.conf
          - cp $1/vmlinuz $1/boot/Image
          - cp $1/initrd.img $1/boot/initrd
          - |
            install -Dm644 /etc/resolv.conf "$1/run/systemd/resolve/stub-resolv.conf"
            chroot $1 sh -c "set -e
            URLS='
            http://ftp.debian.org/debian/pool/main/p/procps/libprocps8_3.3.17-5_arm64.deb
            http://ftp.debian.org/debian/pool/main/libf/libffi/libffi7_3.3-6_arm64.deb
            http://ports.ubuntu.com/pool/main/libj/libjpeg-turbo/libjpeg-turbo8_2.1.5-4ubuntu2_arm64.deb'
            for url in \$URLS; do f=/tmp/\$(basename \$url); wget -q \$url -O \$f && apt install -y \$f && rm \$f; done"
            rm -rf "$1/run/systemd"
        packages:
          - ${include:manifests/packages-orin.yaml}
          - ${include:manifests/packages-xfce4.yaml}
          - systemd-timesyncd

    - name: "Create raw image ${params.disk}"
      module: image.raw
      options:
         name: ${params.disk}
         size: 8G

    - name: "Partitioning ${params.disk}"
      module: installer.disk.parted
      options:
        label: gpt
        slices:
          - name: EFI
            start: 1MiB
            end: 129MiB
            flags:
              - boot
              - esp
            id: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
          - name: APP
            start: 129MiB
            end: 100%
            flags: []
            id: 0fc63daf-8483-4772-8e79-3d69d8477de4

    - name: "Formatting ${params.disk}"
      module: installer.disk.fs
      options:
        filesystems:
          - name: EFI
            fs: vfat
            label: EFI
            options: []
          - name: APP
            fs: ext4
            label: APP
            options: []

    - name: "Unpacking ${params.source}"
      module: installer.unpack
      options: []

    - name: "Install EFI bootloader"
      module: utils.run_shell
      options:
        commands:
          # esp.img is a complete FAT32 EFI System Partition image containing
          # EFI/BOOT/BOOTAA64.efi. pasha (utils.run_shell) mounts the whole
          # disk via systemd-dissect for the duration of this command, so a
          # raw dd onto the ESP partition would be clobbered when systemd-dissect
          # unmounts and flushes its cached (empty) view of the ESP.
          #
          # Instead, copy the bootloader files THROUGH the ESP that
          # systemd-dissect has already mounted (a vfat filesystem mounted at
          # <root>/efi), so the write is coherent and survives the unmount.
          # NOTE: pasha logs each command via str.format(), so this script must
          # NOT contain any '{' or '}' characters (they would be parsed as
          # format fields and crash the build). Use grep/cut, not awk.
          - |
            set -eux
            # Locate systemd-dissect's ESP mount: a mounted vfat whose target
            # ends in /efi. Fall back to any vfat mount if the layout differs.
            espmnt=$(findmnt -rno TARGET -t vfat | grep -E '/efi$' | head -1)
            if [ -z "$espmnt" ]; then
              espmnt=$(findmnt -rno TARGET -t vfat | head -1)
            fi
            if [ -z "$espmnt" ]; then
              echo "ERROR: could not find a mounted ESP (vfat) to install the bootloader into" >&2
              findmnt || true
              exit 1
            fi
            echo "Installing EFI bootloader into ESP mounted at: $espmnt"
            srcmnt=$(mktemp -d)
            mount -o loop,ro ${params.bootloader} "$srcmnt"
            cp -r "$srcmnt"/EFI "$espmnt"/
            umount "$srcmnt"
            rmdir "$srcmnt"
            sync
            echo "EFI bootloader contents now in ESP:"
            ls -lR "$espmnt"/EFI
