---
name: elxr-uefi-amd64
description: "AMD64 example configuration."
architecture: amd64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: aria
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/elxr/ /'
          - 'sync-in overlay/systemd-networkd/ /'
        customize_hooks:
          - echo 'root:root' | chroot "$1" chpasswd
          - chroot "$1" passwd -e root
          - systemctl enable --root="$1" systemd-networkd
          - chroot $1 echo "localhost" > $1/etc/hostname
        packages:
          - ${include:manifests/packages-elxr.yaml}
        mirrors:
          - deb http://mirror.elxr.dev/elxr aria main main-debian-community non-free-firmware non-free-firmware-debian-community contrib
          - deb http://mirror.elxr.dev/elxr aria-updates main main-debian-community non-free-firmware non-free-firmware-debian-community contrib
          - deb http://mirror.elxr.dev/elxr aria-security main main-debian-community non-free-firmware non-free-firmware-debian-community contrib
  