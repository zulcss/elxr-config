---
# Security Component - Essential security components, minimal CA certificates

name: security
description: Essential security components, minimal CA certificates

packages:
  - ca-certificates
  - gnupg

exclude_packages: []

customize_hooks:
  - chroot $1 apt-key add /etc/apt/trusted.gpg.d/eLxr-base.asc
  - rm -rf $1/usr/share/ca-certificates/mozilla/* 2>/dev/null || true

dpkgopt: []
