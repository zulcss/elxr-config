---
name: elxr-cloud-amd64
description: "AMD64 minimal cloud VM configuration."
architecture: amd64
version: 99.99.0
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
  disk: ${oc.env:CURRENT_DIR}/${name}-${version}-${architecture}.img
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: aria
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/elxr/ /'
        customize_hooks:
          - systemctl enable --root="$1" elxr-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
          - chroot $1 echo 'br_netfilter' > $1/etc/modules-load.d/netfilter.conf
          - chroot $1 echo 'vm.swappiness = 0' > $1/etc/sysctl.d/disable_swappiness.conf
          - chroot $1 echo 'net.ipv4.ip_forward = 1' > $1/etc/sysctl.d/enable_forwarding.conf
          - chroot $1 apt remove -y --purge ifupdown
        packages:
          - ${include:manifests/packages-cloud-minimal.yaml}
        mirrors:
          - deb http://mirror.elxr.dev/elxr aria main non-free-firmware contrib
          - deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable

    - name: "Create raw image ${params.disk}"
      module: image.raw
      options:
        name: ${params.disk}
        size: 50G

    - name: "Partitioning ${params.disk}."
      module: installer.disk.parted
      options:
        slices:
          - name: EFI
            start: 0%
            end: 128MB
            flags: [boot, esp]
            id: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
          - name: BOOT
            start: 128M
            end: 640M
            flags: []
            id: bc13c2ff-59e6-4262-a352-b275fd6f7172
          - name: ROOT
            start: 640MB
            end: 100%
            flags: []
            id: ''

    - name: "Formatting ${params.disk}."
      module: installer.disk.fs
      options:
        filesystems:
          - name: EFI
            label: EFI
            fs: vfat
            options: []
          - name: BOOT
            label: BOOT
            fs: ext4
            options: []
          - name: ROOT
            label: ROOT
            fs: ext4
            options: []

    - name: "Unpacking ${params.source}"
      module: installer.unpack
      options: []

    - name: "Installing bootloader on ${params.disk}"
      module: installer.bootloader
      options:
        kernel_args: "root=LABEL=ROOT console=tty0 console=ttyS0,115200"
        uefi_driver: ext4

    - name: "Compress image ${params.disk}"
      module: image.compress
      options:
        name: ${params.disk}
        compression: zstd
