---
name: base
description: "Essential base system configuration for installer"
packages:
  - elxr-archive-keyring
  - linux-image-amd64
  - systemd
  - systemd-sysv
  - udev
  - dbus
  - login
  - bash
  - coreutils
  - util-linux
  - e2fsprogs

customize_hooks:
  - echo 'root:root' | chroot "$1" chpasswd
  - chroot $1 echo "localhost" > $1/etc/hostname

dpkgopt: []
