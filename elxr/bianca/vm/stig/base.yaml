---
name: elxr-stig-installer-amd64
description: "AMD64 base installer configuration for STIG."
architecture: amd64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
stages:
  install:
    - name: "Create rootfs tarball"
      module: bootstrap.mmdebstrap
      options:
        suite: bianca
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/bianca/ /'
          - 'sync-in overlay/systemd-networkd/ /'
        customize_hooks:
          - echo 'root' | chroot "$1" passwd -e -s root
          - systemctl enable --root="$1" systemd-networkd
          - chroot $1 echo "localhost" > $1/etc/hostname
          - mkdir -p $1/efi
        packages:
          - ${include:manifests/packages-elxr.yaml}
          - ${include:manifests/packages-stig.yaml}
        mirrors:
          - deb http://mirror.elxr.dev/elxr bianca main main-debian-community non-free-firmware contrib
