# Dracut configuration for edge devices
# Exclude unnecessary drivers at initramfs build time

# Only include essential modules
add_dracutmodules+=" base systemd systemd-initrd kernel-modules rootfs-block dm fs-lib "

# Exclude unnecessary modules
omit_dracutmodules+=" network ifcfg bluetooth usrmount i18n resume "

# Exclude driver categories
omit_drivers+=" snd* gpu* media* staging* "

# Compress initramfs
compress="zstd"
compresslevel=19

# Minimal hostonly mode
hostonly="no"
hostonly_cmdline="no"