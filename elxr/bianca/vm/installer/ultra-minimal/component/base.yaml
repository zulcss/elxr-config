---
name: base
description: "Essential base system configuration for installer"
packages:
  - elxr-archive-keyring
  - linux-image-amd64
  - systemd
  - systemd-sysv
  - udev
  - dbus
  - login
  - bash
  - coreutils
  - util-linux

customize_hooks:
  - echo 'root' | chroot "$1" passwd -e -s root
  - chroot $1 echo "localhost" > $1/etc/hostname

dpkgopt: []
