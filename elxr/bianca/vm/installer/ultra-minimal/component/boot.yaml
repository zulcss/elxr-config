  - path-exclude=/lib/modules/*/kernel/drivers/xen/*
  - path-exclude=/lib/modules/*/kernel/drivers/hv/*
  - path-exclude=/lib/modules/*/kernel/drivers/accessibility/*
  - path-exclude=/lib/modules/*/kernel/drivers/leds/*
  - path-exclude=/lib/modules/*/kernel/drivers/pcmcia/*
  - path-exclude=/lib/modules/*/kernel/drivers/firewire/*
  - path-exclude=/lib/modules/*/kernel/drivers/vfio/*
