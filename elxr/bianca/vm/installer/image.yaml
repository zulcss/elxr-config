---
name: elxr-minimal-amd64
description: "AMD64 example configuration."
architecture: amd64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  version: ${version}
  source: /oem/elxr-installer-${version}-${architecture}.tar.gz
  disk: /dev/vda
stages:
  install:
    - name: Unpack tarball
      module: unpack.tarball
      options:
        sources:
          - ${params.source}

    - name: Create image
      module: image.repart
      options:
        definitions: definitions/image

    - name: "Installing bootloader on ${params.disk}"
      module: installer.bootloader
      options:
        kernel_args: "root=LABEL=root-x86-64 console=tty0 console=ttyS0,115200"
        uefi_driver: ext4

    - name: "Set boot order on ${params.disk}."
      module: utils.bootorder
    
    - name: "Installation complete successfully."
      module: noop.placeholder

    - name: "Save installation log to rootfs/efi/tiler.log"
      module: utils.copy
      options:
        source: /var/log/tiler.log
        dest: efi/
