---
name: elxr-cloud-amd64
description: "AMD64 minimal cloud VM configuration."
architecture: amd64
version: ${oc.env:DEFAULT_ELXR_VERSION}
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
  disk: ${oc.env:CURRENT_DIR}/${name}-${version}-${architecture}.img
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: bianca
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/bianca/ /'
        customize_hooks:
          - systemctl enable --root="$1" elxr-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
          - chroot $1 echo 'br_netfilter' > $1/etc/modules-load.d/netfilter.conf
          - chroot $1 echo 'vm.swappiness = 0' > $1/etc/sysctl.d/disable_swappiness.conf
          - chroot $1 echo 'net.ipv4.ip_forward = 1' > $1/etc/sysctl.d/enable_forwarding.conf
          - chroot $1 apt remove -y --purge ifupdown
        packages:
          - ${include:manifests/packages-cloud-bianca.yaml}
        mirrors:
          - deb http://mirror.elxr.dev/elxr bianca main main-debian-community non-free-firmware contrib non-free-firmware-debian-community
          - deb http://mirror.elxr.dev/elxr bianca-security main main-debian-community non-free-firmware contrib non-free-firmware-debian-community
          - deb http://mirror.elxr.dev/elxr bianca-updates main main-debian-community non-free-firmware contrib non-free-firmware-debian-community
          - deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable

    - name: Unpack tarball
      module: unpack.tarball
      options:
        sources:
          - ${params.source}

    - name: Create image
      module: image.repart
      options:
        definitions: definitions/image

    - name: "Installing bootloader on ${params.disk}"
      module: installer.bootloader
      options:
        kernel_args: "root=LABEL=root-x86-64 console=tty0 console=ttyS0,115200"

    - name: "Compress image ${params.disk}"
      module: image.compress
      options:
        name: ${params.disk}
        compression: zstd
