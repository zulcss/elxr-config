---
name: cleanup
description: "Aggressive cleanup for minimal size"
packages: []

customize_hooks:
  - rm -rf $1/tmp/* $1/var/tmp/* $1/var/log/*
  - rm -rf $1/usr/share/doc/* $1/usr/share/man/* $1/usr/share/info/* $1/usr/share/linda/* $1/usr/share/lintian/*
  - find $1/usr/share/locale -mindepth 1 -maxdepth 1 ! -name 'en*' -exec rm -rf {} +
  - find $1 -name '*.pyc' -delete
  - find $1 -name '__pycache__' -type d -exec rm -rf {} +
  - rm -rf $1/usr/include $1/usr/src
  - rm -rf $1/usr/share/pixmaps $1/usr/share/icons $1/usr/share/sounds
  - rm -rf $1/usr/share/zoneinfo/* 2>/dev/null || true
  - rm -rf $1/usr/lib/x86_64-linux-gnu/gconv 2>/dev/null || true
  - find $1 -name "*.pyo" -delete 2>/dev/null || true
  - rm -rf $1/usr/share/applications $1/usr/share/desktop-directories 2>/dev/null || true
  - rm -rf $1/usr/share/mime $1/usr/share/xml 2>/dev/null || true
  - find $1/usr/lib/python* -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
  - find $1/usr/lib/python* -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
  - truncate -s 0 $1/var/log/lastlog $1/var/log/faillog 2>/dev/null || true
  - rm -rf $1/usr/lib/locale/locale-archive 2>/dev/null || true
  - rm -rf $1/boot/System.map-* 2>/dev/null || true
  - rm -rf $1/lib/modules/*/build 2>/dev/null || true
  - rm -rf $1/lib/modules/*/source 2>/dev/null || true
  - find $1/usr/share/terminfo -mindepth 1 -maxdepth 1 ! -name "l" ! -name "x" ! -name "v" -exec rm -rf {} + 2>/dev/null || true
  - find $1/usr/bin $1/usr/sbin $1/bin $1/sbin -type f -executable -exec strip --strip-all {} \; 2>/dev/null || true
  - find $1/usr/lib -name "*.so.*" -exec strip --strip-unneeded {} \; 2>/dev/null || true
  - find $1/usr/lib -name "*.so.*" -exec strip --strip-debug {} \; 2>/dev/null || true
  - find $1/usr/lib -name "*.la" -delete 2>/dev/null || true
  - find $1/usr/lib -name "*.a" -delete 2>/dev/null || true
  - find $1/usr/share -name "*.a" -delete 2>/dev/null || true

dpkgopt:
  - path-exclude=/usr/share/doc/*
  - path-exclude=/usr/share/info/*
  - path-exclude=/usr/share/locale/*
  - path-exclude=/usr/share/man/*
  - path-include=/usr/share/doc/*/copyright
  - path-include=/usr/share/locale/en*
  - path-include=/usr/share/dpkg/cputable
  - path-include=/usr/share/dpkg/tupletable
  - path-include=/usr/share/dpkg/archtable
