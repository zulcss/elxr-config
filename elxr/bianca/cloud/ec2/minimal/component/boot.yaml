---
name: boot
description: "Essential boot components (systemd-boot, kernel, init)"
packages:
  - linux-image-cloud-amd64
  - e2fsprogs
  - udev
  - dbus
  - grub2-common 
  - grub-efi-amd64-bin
  - grub-efi-amd64-signed
  - cloud-init
  - cloud-initramfs-growroot
  - procps
  - sudo
  - dbus
  - init
  - kmod

customize_hooks:
  - mkdir -p $1/efi
  # Create /etc/os-release for AWS detection (overwrite existing)
  - printf 'NAME="eLxr"\nID=elxr\nID_LIKE=debian\nVERSION="${version}"\nVERSION_ID="${version}"\nPRETTY_NAME="eLxr ${version}"\nHOME_URL="https://elxr.dev"\n' > $1/usr/lib/os-release
  # Create GRUB directory and default config for AWS
  - mkdir -p $1/boot/grub $1/etc/default
  - printf 'GRUB_DEFAULT=0\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR="eLxr"\nGRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200n8 console=tty0 earlyprintk=ttyS0,115200 consoleblank=0 rw"\nGRUB_CMDLINE_LINUX="net.ifnames=0 rw"\nGRUB_TERMINAL="console serial"\nGRUB_SERIAL_COMMAND="serial --speed=115200"\n' > $1/etc/default/grub
                 
  - echo 'fs0:\\EFI\\BOOT\\BOOTX64.EFI' > $1/efi/startup.nsh
  - rm -rf $1/lib/modules/*/kernel/drivers/{media,staging,hid,i2c,spi,mmc,platform,power,thermal,watchdog,hwmon,leds,regulator} 2>/dev/null || true
  - rm -rf $1/lib/modules/*/kernel/sound 2>/dev/null || true
  - rm -rf $1/usr/share/bash-completion 2>/dev/null || true

dpkgopt:
  - path-exclude=/lib/modules/*/kernel/drivers/staging/*
  - path-exclude=/lib/modules/*/kernel/drivers/hwmon/*
  - path-exclude=/lib/modules/*/kernel/drivers/watchdog/*
  - path-exclude=/lib/modules/*/kernel/drivers/thermal/*
  - path-exclude=/lib/modules/*/kernel/drivers/power/*
  - path-exclude=/lib/modules/*/kernel/sound/*
  - path-exclude=/usr/share/bash-completion/*
