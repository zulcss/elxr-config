---
name: management
description: "Basic package management tools for customer extension on ARM64"

packages:
  - apt
  - dpkg
  - login
  - bash
  - coreutils
  - util-linux

customize_hooks:
  - chroot $1 apt-get clean
  - rm -rf $1/usr/lib/apt/methods/ftp $1/usr/lib/apt/methods/rsh 2>/dev/null || true

dpkgopt: []