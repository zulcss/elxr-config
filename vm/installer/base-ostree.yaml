---
name: elxr-minimal-ostree-amd64
description: "AMD64 ostree configuration."
architecture: amd64
version: 12.10.0.0
schemaVersion: 1
params:
  version: ${version}
  source: ${oc.env:CURRENT_DIR}/elxr-ostree-${version}-${architecture}.tar.gz
  repository: /var/www/html/ostree_repo
  branch: elxr/${architecture}
stages:
  install:
    - name: "Create rootfs"
      module: bootstrap.mmdebstrap
      options:
        suite: bookworm
        target: ${params.source}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/debian/ /'
        customize_hooks:
          - 'sync-in overlay/ostree/usr/lib /usr/lib'
          - echo 'root:root' | chroot "$1" chpasswd
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" elxr-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
          - mkdir -p $1/efi
        packages:
          - ${include:manifests/packages-ostree.yaml}
        mirrors:
          - deb http://deb.debian.org/debian bookworm main non-free-firmware
          - deb http://deb.debian.org/debian bookworm-updates main
          - deb http://security.debian.org/debian-security bookworm-security main
          - deb http://mirror.elxr.dev/elxr aria main

    - name: "Unpack ${params.source}"
      module: unpack.tarball
      options:
        compression: tgz
        sources:
          - ${params.source}

    - name: "Create ostree repository"
      module: installer.ostree.init
      options:
        mode: archive-z2

    - name: "Create an ostree branch."
      module: installer.ostree.prep

    - name: "Commit an ostree branch."
      module: installer.ostree.commit
