---
name: elxr-ai-amd64
description: "AMD64 AI configuration."
architecture: amd64
version: 12.9.0.0
schemaVersion: 1
params:
  version: ${version}
  tarball: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
  source: ${oc.env:CURRENT_DIR}/elxr-installer-${version}-${architecture}.tar.gz
  image: ${oc.env:CURRENT_DIR}/${name}-${version}-${architecture}.img
  disk: /dev/loop1
stages:
  install:
    - name: "Creating installer."
      module: bootstrap.mmdebstrap
      options:
        suite: bookworm
        target: ${params.tarball}
        architecture: ${architecture}
        setup_hooks:
          - 'sync-in overlay/debian/ /'
        customize_hooks:
          - echo 'root:root' | chroot "$1" chpasswd
          - systemctl enable --root="$1" systemd-networkd
          - systemctl enable --root="$1" elxr-growfs
          - chroot $1 echo "localhost" > $1/etc/hostname
        packages:
          - ${include:manifests/packages-base.yaml}
          - ${include:manifests/packages-ai.yaml}
        mirrors:
          - deb http://deb.debian.org/debian bookworm main non-free-firmware
          - deb http://deb.debian.org/debian bookworm-updates main
          - deb http://security.debian.org/debian-security bookworm-security main
          - deb http://mirror.elxr.dev/elxr aria main

    - name: "Create raw image ${params.image}"
      module: image.raw
      options:
        name: ${params.image}
        size: 4G

    - name: "Partitioning ${params.disk}."
      module: installer.disk.parted
      options:
        slices:
          - name: EFI
            start: 0%
            end: 128MB
            flags: [boot, esp]
            id: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
          - name: BOOT
            start: 128M
            end: 640M
            flags: []
            id: bc13c2ff-59e6-4262-a352-b275fd6f7172
          - name: ROOT
            start: 640MB
            end: 100%
            flags: []
            id: ''

    - name: "Formatting ${params.disk}."
      module: installer.disk.fs
      options:
        filesystems:
          - name: EFI
            label: EFI
            fs: vfat
            options: []
          - name: BOOT
            label: BOOT
            fs: ext4
            options: []
          - name: ROOT
            label: ROOT
            fs: ext4
            options: []

    - name: "Unpacking ${params.source}"
      module: installer.unpack
      options: []

    - name: "Installing bootloader on ${params.disk}"
      module: installer.bootloader
      options:
        kernel_args: "root=LABEL=ROOT console=tty0 console=ttyS0,115200"
        uefi_driver: ext4

    - name: "Undeploy on ${params.disk}."
      module: utils.undeploy

    - name: "Compress image ${params.image}"
      module: image.compress
      options:
        name: ${params.image}
        compression: zstd
